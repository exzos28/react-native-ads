buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Pangle ships on a Maven repo outside Google's defaults (LevelPlay is on
// Maven Central, no extra repo needed). The Expo config plugin in
// @react-native-ads/pangle adds this automatically for Expo apps; bare RN
// apps need it added here manually (see the package's README).
allprojects {
    repositories {
        maven { url "https://artifact.bytedance.com/repository/pangle" }
    }
}
