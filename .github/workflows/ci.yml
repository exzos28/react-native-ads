name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            unity:
              - 'packages/unity/**'
            pangle:
              - 'packages/pangle/**'
            liftoff:
              - 'packages/liftoff/**'
            levelplay:
              - 'packages/levelplay/**'

      - name: Build affected-packages matrix
        id: list
        run: |
          packages=$(node -e "
            const filters = { unity: '${{ steps.filter.outputs.unity }}', pangle: '${{ steps.filter.outputs.pangle }}', liftoff: '${{ steps.filter.outputs.liftoff }}', levelplay: '${{ steps.filter.outputs.levelplay }}' };
            console.log(JSON.stringify(Object.keys(filters).filter((k) => filters[k] === 'true')));
          ")
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint all packages
        run: yarn turbo run lint

      - name: Typecheck all packages
        run: yarn turbo run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests for all packages
        run: yarn turbo run test -- --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build all packages
        run: yarn turbo run build

  build-android:
    needs: changed
    if: needs.changed.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changed.outputs.packages) }}
    env:
      TURBO_CACHE_DIR: .turbo/android-${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn workspace @react-native-ads/${{ matrix.package }} nitrogen

      - name: Cache turborepo for Android
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ matrix.package }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-${{ matrix.package }}-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --filter=@react-native-ads/${{ matrix.package }}-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Build example for Android
        if: env.turbo_cache_hit != 1
        run: yarn turbo run build:android --filter=@react-native-ads/${{ matrix.package }}-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    needs: changed
    if: needs.changed.outputs.packages != '[]'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changed.outputs.packages) }}
    env:
      TURBO_CACHE_DIR: .turbo/ios-${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn workspace @react-native-ads/${{ matrix.package }} nitrogen

      - name: Cache turborepo for iOS
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ matrix.package }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-${{ matrix.package }}-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --filter=@react-native-ads/${{ matrix.package }}-example --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Set up Ruby
        if: env.turbo_cache_hit != 1
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
          working-directory: packages/${{ matrix.package }}/example

      - name: Cache CocoaPods downloads
        if: env.turbo_cache_hit != 1
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ matrix.package }}-${{ hashFiles(format('packages/{0}/example/ios/Podfile', matrix.package), format('packages/{0}/*.podspec', matrix.package)) }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-${{ matrix.package }}-

      - name: Install cocoapods
        if: env.turbo_cache_hit != 1
        run: |
          cd packages/${{ matrix.package }}/example/ios
          bundle exec pod install

      - name: Build example for iOS
        if: env.turbo_cache_hit != 1
        run: yarn turbo run build:ios --filter=@react-native-ads/${{ matrix.package }}-example --cache-dir="${{ env.TURBO_CACHE_DIR }}"
